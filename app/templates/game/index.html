11{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">ClueQuest AI</h1>
        <div class="text-gray-400">
            Level: {{ current_user.progress + 1 }}
        </div>
    </div>

    <div id="error" class="bg-red-500 text-white p-3 rounded mb-4 hidden"></div>

    <div id="story-container" class="hidden">
        <div class="bg-gray-800 p-6 rounded-lg mb-6">
            <h2 class="text-2xl font-bold mb-4">Case Details</h2>
            <div id="story-content"></div>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div class="bg-gray-800 p-6 rounded-lg">
                <h3 class="text-xl font-bold mb-4">Investigation Actions</h3>
                <div class="space-y-4">
                    <button onclick="setStage('clue_hunt')"
                        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition-colors">
                        Look for Clues
                    </button>
                    <button onclick="setStage('interview')"
                        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition-colors">
                        Interview Suspects
                    </button>
                    <button onclick="setStage('guess')"
                        class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition-colors">
                        Make an Accusation
                    </button>
                </div>
            </div>

            <div id="action-container" class="bg-gray-800 p-6 rounded-lg">
                <!-- Action content will be loaded here -->
            </div>
        </div>
    </div>

    <div id="start-container" class="text-center">
        <button onclick="generateStory()"
            class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700 transition-colors">
            Start New Case
        </button>
    </div>
</div>

<script>
let currentStory = null;
let currentStage = 'start';

async function generateStory() {
    try {
        const response = await fetch('/generate_story', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
        });
        const data = await response.json();
        currentStory = data.story;
        document.getElementById('story-content').textContent = currentStory;
        document.getElementById('story-container').classList.remove('hidden');
        document.getElementById('start-container').classList.add('hidden');
    } catch (error) {
        showError('Failed to generate story');
    }
}

function setStage(stage) {
    currentStage = stage;
    const container = document.getElementById('action-container');
    
    switch (stage) {
        case 'clue_hunt':
            container.innerHTML = `
                <h3 class="text-xl font-bold mb-4">Found Clues</h3>
                <div class="space-y-2">
                    ${currentStory.clues.map((clue, index) => `
                        <button onclick="selectClue('${clue}')"
                            class="w-full text-left p-2 hover:bg-gray-700 rounded">
                            Clue #${index + 1}
                        </button>
                    `).join('')}
                </div>
            `;
            break;
        case 'interview':
            container.innerHTML = `
                <h3 class="text-xl font-bold mb-4">Suspects</h3>
                <div class="space-y-2">
                    ${Object.entries(currentStory.suspects).map(([name, info]) => `
                        <button onclick="selectSuspect('${name}')"
                            class="w-full text-left p-2 hover:bg-gray-700 rounded">
                            ${name}
                        </button>
                    `).join('')}
                </div>
            `;
            break;
        case 'guess':
            container.innerHTML = `
                <h3 class="text-xl font-bold mb-4">Make Your Accusation</h3>
                <div class="space-y-2">
                    ${Object.keys(currentStory.suspects).map(name => `
                        <button onclick="makeGuess('${name}')"
                            class="w-full text-left p-2 hover:bg-gray-700 rounded">
                            ${name}
                        </button>
                    `).join('')}
                </div>
            `;
            break;
    }
}

async function makeGuess(suspect) {
    if (suspect === currentStory.culprit) {
        try {
            const response = await fetch('/update_progress', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
            });
            const data = await response.json();
            alert('Congratulations! You solved the case!');
            document.getElementById('story-container').classList.add('hidden');
            document.getElementById('start-container').classList.remove('hidden');
        } catch (error) {
            showError('Failed to update progress');
        }
    } else {
        alert('Wrong guess! Try again.');
    }
}

function showError(message) {
    const errorDiv = document.getElementById('error');
    errorDiv.textContent = message;
    errorDiv.classList.remove('hidden');
    setTimeout(() => errorDiv.classList.add('hidden'), 3000);
}
</script>
{% endblock %}
